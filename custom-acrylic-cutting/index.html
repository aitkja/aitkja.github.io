<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Canonical: strip /index.html so clean trailing-slash URL is the only indexed path */
      (function () {
        var p = location.pathname;
        if (/\/index\.html$/i.test(p)) {
          var clean = p.replace(/\/index\.html$/i, "/");
          if (!clean) clean = "/";
          location.replace(clean + location.search + location.hash);
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=https://forestcitylaser.com/acrylic-cutting-london-on/" />
    <link rel="canonical" href="https://forestcitylaser.com/acrylic-cutting-london-on/" />
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Acrylic Cutting London ON | Forest City Laser</title>
    <script>
      location.replace("https://forestcitylaser.com/acrylic-cutting-london-on/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="https://forestcitylaser.com/acrylic-cutting-london-on/">Acrylic Cutting in London, Ontario</a>.</p>
  </body>
</html>
